[package]
name = "tinymusic"
version = "0.9.0"
description = "TinyMusic - 极简本地桌面音乐播放器"
authors = ["jinfenglong"]
edition = "2021"
# 多 bin（含 scan_repro 调试工具）时指定 tauri dev 的 `cargo run` 默认二进制
default-run = "tinymusic"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tinymusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.4"
walkdir = "2.5.0"
thiserror = "2.0.21"
parking_lot = "0.12.5"
tauri-plugin-dialog = "2.8.0"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
notify = "8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", default-features = false, features = ["macros", "time", "sync"] }
trash = "5"
tauri-plugin-global-shortcut = "2"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_WinRT"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
